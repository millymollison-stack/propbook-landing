  <link rel="stylesheet" href="index.css?v=1788726316593" />
  <script>window.__PROPERTY_DATA__ = {"id":"860d265b-37bd-4367-a9ea-21214a00733c","slug":"ravesnwortha1","title":"Untitled Property","name":"@ravesnwortha1","description":"","property_title":"Untitled Property","property_headline":"Untitled Property","property_intro":"Welcome to Surf House Baja, a 4-bedroom beach house sitting directly in front of the iconic Shipwrecks surf spot just 4 hours south of the border.","hero_image":"https://a0.muscache.com/im/pictures/hosting/Hosting-1569039869816457609/original/916d4101-a034-4160-80c5-7d4cbb538b98.jpeg?im_w=1200","images":["https://a0.muscache.com/im/pictures/hosting/Hosting-1569039869816457609/original/916d4101-a034-4160-80c5-7d4cbb538b98.jpeg?im_w=1200","https://a0.muscache.com/im/pictures/hosting/Hosting-1569039869816457609/original/801cf55c-6fd6-4e88-b4d4-df902eb81470.jpeg?im_w=1200","https://a0.muscache.com/im/pictures/hosting/Hosting-1569039869816457609/original/2f2d2ee4-14d7-463c-a721-a221a9a6138c.jpeg?im_w=1200","https://a0.muscache.com/im/pictures/hosting/Hosting-1569039869816457609/original/a36196e3-6b6c-4560-8aaf-2070a31697f8.jpeg?im_w=1200","https://a0.muscache.com/im/pictures/hosting/Hosting-1569039869816457609/original/079f8bb5-9d66-40b3-96f9-984ef21e56f4.jpeg?im_w=1200","https://a0.muscache.com/im/pictures/hosting/Hosting-1569039869816457609/original/9d73d5e8-3581-414a-a4a3-7ce0ab4c970a.jpeg?im_w=1200","https://a0.muscache.com/im/pictures/hosting/Hosting-1569039869816457609/original/fa1ece39-8f0f-4c7b-ad78-b7b7007faad6.jpeg?im_w=1200","https://a0.muscache.com/im/pictures/hosting/Hosting-1569039869816457609/original/7cbd827e-b9d3-4e98-af3d-0b8591910df3.jpeg?im_w=1200","https://a0.muscache.com/im/pictures/hosting/Hosting-1569039869816457609/original/55dfbb69-c61c-4075-a01b-bdda79ec1342.jpeg?im_w=1200"],"address":"","location":"","bedrooms":2,"beds":3,"bathrooms":1,"max_guests":8,"price_per_night":150,"rating":null,"reviews":null,"brand_color":null,"font_accent":null,"property_details":"House Baja has 4 uniquely designed bedrooms all with access to the ocean front balcony. Wake up to a view of the ocean and a point break wave you will be eager to jump in and surf. \n\nThe open-plan kitchen has plenty of space for cooking up a feast, while friends can hang out at the counter on playful swings suspended from the ceiling.\n\nThe dining area seats six, and there’s an even bigger table on the patio for lively group meals under the stars.\n\nUpstairs, the first two bedrooms have floor to ceiling ocean facing windows, each with double beds, crisp white linens, and storage space. The third bedroom has a queen bed and a writing desk, while the fourth has a cozy single. Need extra sleeping space? The large upstairs hallway has a guest sofa bed. \n\nStep out onto the balcony for morning stretches, sun-soaked afternoons, or sunset cocktails.\nThe bathroom keeps it simple with a spacious hot shower, hand-built furnishings, and plenty of fresh towels. \n\nOutside, unwind in the sand garden with hammocks, swings, and a fire pit, perfect for starlit conversations. \n\nFeeling competitive? The garage has a ping pong table ready for action. Plus, there’s a surfboard rack with foam boards and a stash of used wetsuits, so you can get everyone in the ocean.","activities":"This quiet oceanfront spot has it all—if you’re not surfing Shipwrecks right out the front of the house, check out the tide pools at low tide, find rocks, and a decaying ship resting in the bay.\n\nThe neighborhood is safe, friendly, and laid-back. Beyond the gates, open land gives you a true sense of freedom, and the local town has supermarkets, restaurants, and whatever you need.\n\nThe Baja 1000 coastal route runs right outside the gates, perfect for watching off-roaders race up the coast.\n\nSurf: \nThe house is located right at the famous \"Shipwrecks\" surf break, known for long right-peeling waves most of the year. The best conditions are during a big swell and high tide. On smaller days, you’ll get an extra foot in size on a rising tide. It can get windy at certain times, but you're good to surf before 10 a.m. and after 6 p.m. The break gets its name from a huge shipwreck that ran aground in 1982 and has been slowly reclaimed by the ocean.\n\nOn the right swell, you can ride the wave from directly in front of the house all the way around the bay—about 3/4 mile! While I haven't done it myself, I’ve seen many skilled surfers make the journey back to the point with huge smiles. Every local has their own story of when they caught it just right!\n\nStars:\nAt night, watch campfires dotting the bay from the ship or gaze at the moon’s reflection on the water from the house balcony. Thanks to the clean, dry air and lack of streetlights, the stars and Milky Way here are brighter than you'll ever see. Just a short drive away is Mexico’s national observatory, perched high in the mountains (snow-capped in winter) — considered the 4th best spot globally for stargazing. From there, you can see both the Pacific Ocean and the Sea of Cortez!\n\nFishing:\nThe local fishermen head out in front of the ship every morning before sunrise and return around 10 a.m. If you’re up early, you can buy the fresh catch of the day directly from them—prices and quality are unbeatable! The hustle and bustle of locals guiding the boats past the waves and pulling them up the beach is a great experience. Just ask what they’ve caught and make your purchase.\n\nIf you're looking for more, 40 minutes south is San Quintin, where you’ll find ancient volcanoes and Oyster Bay. Stop by the Oyster Shack for 12 oysters for just $4. Fishing boats from San Quintin also head out to Isla San Martin, offering world-class fishing.\n\n4x4:\nThe Baja 500 and 1000 routes run right along the back of the property, so you can watch 4x4s, bikes, and other vehicles test their limits on the track. If you're visiting during race season, you might even catch the pros in action pre-running the course. On race day, stay safely on the balcony and watch it from there. Street level is super dangerous!","local_area":"The house is 15 minutes from Mexico’s national park and observatory and 40 minutes from San Quintín's ancient volcanoes and Oyster Bay - $5 for 20 Amazing!, Fishing boats head out to Isla San Martín for world-class fishing from San Quintín. Call and book a trip K&M Fishing - $500 x4 people for the day.\n\nLocal fishermen head out right in front of the house most mornings and offer fresh catches at unbeatable prices—get there around 10 a.m. and strike a deal.\n\nFor the best tacos in town, check out Pericos at the end of town—look for the orange building with smoke billowing from a custom-built grill. It’s a must-try!\n\nA trip to Oyster Bay in San Quintín is a must, where you can get 20 oysters shucked or BBQ'd for just $5.\nOn Fridays, there’s a popular Oaxaca market 25 minutes south in Vicente Guerrero.","getting_there":"Head straight out to Highway 1(D) its a toll road and takes you straight out to the ocean and away from local traffic. Head 2 hours south to Ensenada and then another 2 hours south through beautiful wine country. Welcome to rural Baja California. It's beautiful. \n\nThe road to the house is directly off Highway 1. 10 minutes towards the ocean, and then you are at the main gate to the neighborhood. I can be locked after 7:30pm so beep twice and security will arrive in a few minutes.\n\nCall Ramon on: 0115216161117557 and tell them you are staying at Lot 3 if needed or you want firewood. \n\nIf you have any problems with the house, you can call Julio at: 0115216161084774. He is usually just a few minutes away between 10:30am and 4pm in the day.","host_name":null,"email":null,"owner_id":"61a73e59-a899-4553-b620-e7826faf782f"};</script>
